<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transaction</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        width: 420px;
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 20px;
      }

      label {
        font-weight: bold;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        margin: 10px 0 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background: #218838;
      }

      a {
        display: block;
        text-align: center;
        margin-top: 15px;
        text-decoration: none;
        color: #007bff;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Customer Transaction</h2>

      <form action="/transaction" method="POST">
        <label>Transaction Type</label>
        <select name="t_type" required>
          <option value="deposit">Deposit</option>
          <option value="withdraw">Withdraw</option>
        </select>

        <label>Account Number</label>
        <input
          type="number"
          name="caccno"
          placeholder="Enter Account Number"
          required
        />

        <label>Amount</label>
        <input
          type="number"
          name="amount"
          step="0.01"
          placeholder="Enter Amount"
          required
        />

        <button type="submit">Submit</button>
      </form>

      <a href="/adminDashboard">⬅ Back to Dashboard</a>
    </div>
  </body>
</html>

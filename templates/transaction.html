<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank Transaction</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #eef3f8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        width: 450px;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        color: #0d6efd;
        margin-bottom: 25px;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: #0d6efd;
      }

      button {
        width: 100%;
        padding: 13px;
        margin-top: 25px;
        background: #198754;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 17px;
        font-weight: bold;
      }

      button:hover {
        background: #157347;
      }

      .links {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }

      .links a {
        text-decoration: none;
        color: #0d6efd;
        font-weight: bold;
      }

      .links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>💳 Customer Transaction</h2>

      <form action="/transaction" method="POST">
        <label>Transaction Type</label>

        <select name="t_type" required>
          <option value="">Select Transaction</option>

          <option value="deposit">Deposit</option>

          <option value="withdraw">Withdraw</option>
        </select>

        <label>Account Number</label>

        <input
          type="number"
          name="caccno"
          placeholder="Enter Account Number"
          required
        />

        <label>Amount</label>

        <input
          type="number"
          name="amount"
          step="0.01"
          min="1"
          placeholder="Enter Amount"
          required
        />

        <button type="submit">Submit Transaction</button>
      </form>

      <div class="links">
        <a href="/dashboard"> 🏠 Dashboard </a>

        <a href="/adminDashboard"> 👥 Customers </a>
      </div>
    </div>
  </body>
</html>

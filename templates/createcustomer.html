<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Customer</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #eef3f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        width: 450px;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        color: #0d6efd;
        margin-bottom: 25px;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
      }

      input:focus {
        outline: none;
        border-color: #0d6efd;
      }

      button {
        width: 100%;
        padding: 13px;
        margin-top: 25px;
        background: #198754;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #157347;
      }

      .links {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }

      .links a {
        text-decoration: none;
        color: #0d6efd;
        font-weight: bold;
      }

      .links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>👤 Create Customer</h2>

      <form action="/insertData" method="POST">
        <label>Customer Name</label>

        <input
          type="text"
          name="name"
          placeholder="Enter Customer Name"
          required
        />

        <label>Mobile Number</label>

        <input
          type="tel"
          name="mobile"
          placeholder="Enter Mobile Number"
          pattern="[0-9]{10}"
          maxlength="10"
          required
        />

        <label>Email Address</label>

        <input
          type="email"
          name="email"
          placeholder="Enter Email Address"
          required
        />

        <label>Opening Balance</label>

        <input
          type="number"
          name="balance"
          placeholder="Enter Opening Balance"
          min="0"
          step="0.01"
          required
        />

        <button type="submit">Create Customer</button>
      </form>

      <div class="links">
        <a href="/dashboard"> 🏠 Dashboard </a>

        <a href="/adminDashboard"> 👥 Customers </a>
      </div>
    </div>
  </body>
</html>

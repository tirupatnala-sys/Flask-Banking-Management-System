<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f2f2f2;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        width: 380px;
        background: #fff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
      }

      .show-password {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 10px 0 20px 0;
      }

      .show-password input {
        width: 18px;
        height: 18px;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      .msg {
        color: red;
        text-align: center;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Admin Login</h2>

      {% if message %}
      <p class="msg">{{message}}</p>
      {% endif %}

      <form action="/adminLogin" method="POST">
        <input
          type="text"
          name="username"
          placeholder="Enter Username"
          required
        />

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter Password"
          required
        />

        <div class="show-password">
          <input type="checkbox" id="show" onclick="showPassword()" />
          <label for="show">Show Password</label>
        </div>

        <button type="submit">Login</button>
      </form>
    </div>

    <script>
      function showPassword() {
        var x = document.getElementById("password");

        if (x.type === "password") {
          x.type = "text";
        } else {
          x.type = "password";
        }
      }
    </script>
  </body>
</html>
